//	==================================================
//	Sea Dragon engines (Truax design, 1962)
//
//	=================================================================================
//	Stage 1 (SDEngine1)
//
//	Dry Mass: 288.303 t
//	Thrust (SL): 355.8 MN
//	Thrust (Vac): ~391 MN		ESTIMATED from SL thrust and an assumed vac Isp
//	ISP: 242 SL / ~266 Vac		vac value is an ESTIMATE (~10% above SL)
//	Burn Time: 81
//	Chamber Pressure: 20 -> 14 atm (falls as tanks empty; modelled as constant)
//	Propellant: LOX / RP-1
//	Prop Ratio: 2.3
//	Throttle: N/A (pressure-fed, fixed)
//	Ignitions: 1
//	Sources:

//	(1) https://en.wikipedia.org/wiki/Sea_Dragon_(rocket)
//	(2) http://www.astronautix.com/s/seadragon.html

//	Notes:

//	Never built or flown, so specLevel = concept and no real TESTFLIGHT data exist.
//	==================================================

// ---------------------------------------------------------------
// STAGE 1
// ---------------------------------------------------------------
@PART[SDEngine1]:FOR[RealismOverhaulEngines]:NEEDS[RealismOverhaul]
{
	@title = Sea Dragon First Stage Engine
	%description = The first stage engine of the Sea Dragon, a single-chamber pressure-fed LOX/RP-1 engine producing over 350 MN of thrust. Designed to be fired underwater after the vehicle floats upright; never built.
	@tags ^= :$: USA sea-dragon truax liquid pressure-fed kerolox lox rp-1 booster

	%specLevel = concept

	@mass = 288.303

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
		%throttleLocked = True
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	// Gimbal left at the mod's own values (2.5 deg). Verify against Truax/Astronautix
	// and override here with %gimbalRange / %gimbalResponseSpeed if needed.

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		origMass = 288.303
		configuration = SeaDragon-Stage1
		modded = false

		CONFIG
		{
			name = SeaDragon-Stage1
			specLevel = concept
			maxThrust = 391000		// ESTIMATE: 355,800 kN SL x (266 / 242)
			minThrust = 391000		// fixed thrust
			heatProduction = 100

			PROPELLANT
			{
				name = Kerosene
				ratio = 0.3769
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.6231
			}

			atmosphereCurve
			{
				key = 0 266			// ESTIMATE (vacuum)
				key = 1 242			// sea level, Wikipedia
			}

			ullage = False
			pressureFed = True
			ignitions = 1
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.8
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 81
				ratedBurnTime = 81
				safeOverburn = false
				ignitionReliabilityStart = 0.90
				ignitionReliabilityEnd = 0.98
				cycleReliabilityStart = 0.90
				cycleReliabilityEnd = 0.98
			}
		}
	}
}
