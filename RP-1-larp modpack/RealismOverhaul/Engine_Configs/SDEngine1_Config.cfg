// Sources: Wikipedia + Astronautix "Sea Dragon"

// ---------------------------------------------------------------
// STAGE 1: single pressure-fed LOX/RP-1 engine
// 355.8 MN at sea level, Isp 242 s (SL), 81 s burn, O/F 2.3
// ---------------------------------------------------------------
@PART[SDEngine1]:FOR[ImprovedSeaDragon]:NEEDS[RealismOverhaul]
{
	@mass = 288.303

	@MODULE[ModuleEngines*]:HAS[#engineID[SDEngine1]]
	{
		@name = ModuleEnginesRF
		@maxThrust = 391000	// ESTIMATE: 355,800 kN SL x (266 / 242).
		@minThrust = 391000	
		%throttleLocked = True
		@heatProduction = 100
		%pressureFed = True
		%ignitions = 1		// fires once, on the water

		@PROPELLANT[LiquidFuel]	// O/F 2.3 by mass, volume fractions
		{
			@name = Kerosene
			@ratio = 0.3769
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.6231
		}

		@atmosphereCurve
		{
			@key,1 = 1 242		// sea level, per Wikipedia
		}

		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 0.8
		}
	}
}

// ---------------------------------------------------------------
// STAGE 2: single pressure-fed LOX/LH2 engine
// 62.8 MN vacuum, Isp 409 s (vac), 260 s burn, O/F 5.0
// ---------------------------------------------------------------
@PART[SDEngine2]:FOR[ImprovedSeaDragon]:NEEDS[RealismOverhaul]
{
	@mass = 70.044

	@MODULE[ModuleEngines*]:HAS[#engineID[SDEngine2]]
	{
		@name = ModuleEnginesRF
		@maxThrust = 62800
		@minThrust = 62800	
		%throttleLocked = True
		@heatProduction = 100
		%pressureFed = True
		%ignitions = 2

		@PROPELLANT[LqdHydrogen]
		{
			@ratio = 0.7631
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.2369
		}

		@atmosphereCurve
		{
			@key,0 = 0 409		// vacuum, per Wikipedia (extended nozzle, 27:1)
			
		}

		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 0.8
		}
	}
}