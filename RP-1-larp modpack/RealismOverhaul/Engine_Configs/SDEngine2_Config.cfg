//	==================================================
//	Sea Dragon engines (Truax design, 1962)
//
//	=================================================================================
//	=================================================================================
//	Stage 2 (SDEngine2)
//
//	Dry Mass: 70.044 t
//	Thrust (Vac): 62.8 MN
//	ISP: 409 Vac				extended nozzle, ~27:1
//	Burn Time: 260
//	Chamber Pressure: ~7 atm
//	Propellant: LOX / LH2
//	Prop Ratio: 5.0
//	Throttle: N/A (pressure-fed, fixed)
//	Ignitions: 1
//	=================================================================================
//	(1) https://en.wikipedia.org/wiki/Sea_Dragon_(rocket)
//	(2) http://www.astronautix.com/s/seadragon.html
//	Notes:
//	Never built or flown, so specLevel = concept and no real TESTFLIGHT data exist.
//	Stage 2 sea-level Isp is a placeholder: at ~7 atm chamber pressure and a 27:1 nozzle
//	the flow is heavily separated at 1 atm, so this stage is never meant to fire there.

@PART[SDEngine2]:FOR[RealismOverhaulEngines]:NEEDS[RealismOverhaul]
{
	@title = Sea Dragon Second Stage Engine
	%description = The second stage engine of the Sea Dragon, a pressure-fed LOX/LH2 engine with an extendable nozzle producing about 63 MN in vacuum. Never built.
	@tags ^= :$: USA sea-dragon truax liquid pressure-fed hydrolox lox lh2 upper

	%specLevel = concept

	@mass = 70.044

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
		%throttleLocked = True
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		origMass = 70.044
		configuration = SeaDragon-Stage2
		modded = false

		CONFIG
		{
			name = SeaDragon-Stage2
			specLevel = concept
			maxThrust = 62800
			minThrust = 62800		// fixed thrust
			heatProduction = 100

			// The mod's original engine already uses LqdHydrogen as its first propellant.
			// Defining both nodes inside the CONFIG avoids needing to match the old ones.
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7631
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2369
			}

			atmosphereCurve
			{
				key = 0 409
				key = 1 100			// PLACEHOLDER, see notes above
			}

			ullage = False
			pressureFed = True
			ignitions = 1
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.8
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 260
				ratedBurnTime = 260
				safeOverburn = false
				ignitionReliabilityStart = 0.90
				ignitionReliabilityEnd = 0.98
				cycleReliabilityStart = 0.90
				cycleReliabilityEnd = 0.98
			}
		}
	}
}