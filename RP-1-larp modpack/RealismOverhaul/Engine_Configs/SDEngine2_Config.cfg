// Sources: Wikipedia + Astronautix "Sea Dragon"
//https://en.wikipedia.org/wiki/Sea_Dragon_(rocket)
//http://www.astronautix.com/s/seadragon.html
// ---------------------------------------------------------------
// STAGE 2: single pressure-fed LOX/LH2 engine
// 62.8 MN vacuum, Isp 409 s (vac), 260 s burn, O/F 5.0
// ---------------------------------------------------------------
@PART[SDEngine2]:FOR[ImprovedSeaDragon]:NEEDS[RealismOverhaul]
{
	@mass = 70.044

	@MODULE[ModuleEngines*]:HAS[#engineID[SDEngine2]]
	{
		@name = ModuleEnginesRF
		@maxThrust = 62800
		@minThrust = 62800	
		%throttleLocked = True
		@heatProduction = 100
		%pressureFed = True
		%ignitions = 2

		@PROPELLANT[LqdHydrogen]
		{
			@ratio = 0.7631
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.2369
		}

		@atmosphereCurve
		{
			@key,0 = 0 409		// vacuum, per Wikipedia (extended nozzle, 27:1)
			
		}

		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 0.8
		}
	}
}