// --------------------------------------------------------
// Service Module
// --------------------------------------------------------
@PART[KCHS_TG_ServiceModule]:FOR[RealismOverhaul]
{
    %RSSROConfig = true
    @rescaleFactor = 1.0
    @title = Tiangong Service Module
    @manufacturer = CAST
    
    @mass = 1.50
    @maxTemp = 900
    @skinMaxTemp = 2000
    
    !RESOURCE,* {}
    !MODULE[ModuleFuelTanks],* {}
    !MODULE[ModuleB9PartSwitch],* {}
    !MODULE[ModuleDataTransmitter],* {}
    
    %MODULE[ModuleFuelTanks]
    {
        %type = ServiceModule
        %volume = 2000
        %basemass = -1
        
        TANK
        {
            name = UDMH
            amount = 650
            maxAmount = 650
        }
        TANK
        {
            name = NTO
            amount = 925
            maxAmount = 925
        }
        TANK
        {
            name = Helium
            amount = 25000
            maxAmount = 25000
        }
        TANK
        {
            name = ElectricCharge
            amount = 20000
            maxAmount = 20000
        }
    }
    
    !MODULE[ModuleRCS*],* {}
    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = RCSjet
        thrusterPower = 0.15
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = RCSrunning
        
        PROPELLANT
        {
            name = UDMH
            ratio = 0.413
        }
        PROPELLANT
        {
            name = NTO
            ratio = 0.587
        }
        PROPELLANT
        {
            name = Helium
            ratio = 11.25
            ignoreForIsp = True
        }
        
        atmosphereCurve
        {
            key = 0 280
            key = 1 100
        }
    }
}

// --------------------------------------------------------
// Main Engine
// --------------------------------------------------------
@PART[KCHS_TG_MainEngine]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    @rescaleFactor = 1.0
    @title = Tiangong Main Engine
    @manufacturer = CAST
    
    @mass = 0.05
    @maxTemp = 900
    @skinMaxTemp = 2000
    
    !MODULE[ModuleEngines*],* {}
    MODULE
    {
        name = ModuleEnginesFX
        thrustVectorTransformName = thrustTransform
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 0.98
        maxThrust = 0.98
        heatProduction = 20
        fxOffset = 0, 0, 0.01
        EngineType = LiquidFuel
    }
    
    !MODULE[ModuleEngineConfigs],* {}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEnginesFX
        configuration = Tiangong Main Engine
        
        CONFIG
        {
            name = Tiangong Main Engine
            minThrust = 0.98
            maxThrust = 0.98
            heatProduction = 20
            ullage = False
            pressureFed = False
            ignitions = 500
            
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.1
            }
            
            PROPELLANT
            {
                name = UDMH
                ratio = 0.413
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.587
                DrawGauge = False
            }
            PROPELLANT
            {
                name = Helium
                ratio = 11.25
                ignoreForIsp = True
            }
            
            atmosphereCurve
            {
                key = 0 290
                key = 1 120
            }
        }
    }
}

