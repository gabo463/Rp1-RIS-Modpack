// --------------------------------------------------------
// Docking Port
// --------------------------------------------------------
@PART[KCHS_TG_DockingPort]:FOR[RealismOverhaul]
{
    %RSSROConfig = true
    @rescaleFactor = 1.0
    @title = Tiangong APAS Docking Port
    @manufacturer = CAST
    @mass = 0.20
    
    @MODULE[ModuleDockingNode]
    {
        @nodeType = APAS8995
        %acquireForce = 0.5
        %acquireMinFwdDot = 0.8
        %acquireminRollDot = -3.40282347E+38
        %acquireRange = 0.25
        %acquireTorque = 0.5
        %captureMaxRvel = 0.1
        %captureMinFwdDot = 0.998
        %captureMinRollDot = -3.40282347E+38
        %captureRange = 0.05
        %minDistanceToReEngage = 0.25
        %undockEjectionForce = 0.1
    }
}

