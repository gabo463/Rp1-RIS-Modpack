// --------------------------------------------------------
// Main Parachute
// --------------------------------------------------------
@PART[KCHS_SZ_MainParachute]:FOR[RealismOverhaul]
{
    %RSSROConfig = true
    @rescaleFactor = 1.0
    @title = Shenzhou Main Parachute System
    @manufacturer = CAST
    
    @mass = 0.15
    @maxTemp = 900
    @skinMaxTemp = 2000
    
    !MODULE[RealChuteModule],* {}
    
    MODULE
    {
        name = RealChuteModule
        caseMass = 0.15
        timer = 0
        mustGoDown = true
        spareChutes = 0
        cutSpeed = 0.5
        
        PARACHUTE
        {
            material = Nylon
            preDeployedDiameter = 4.0
            deployedDiameter = 35.0
            minIsPressure = false
            minDeployment = 10000
            deploymentAlt = 3000
            cutAlt = -1
            preDeploymentSpeed = 2
            deploymentSpeed = 6
            preDeploymentAnimation = RC_chute_semi_deploy
            deploymentAnimation = RC_chute_full_deploy
            parachuteName = RC_canopy
            capName = box
        }
        PARACHUTE
        {
            material = Kevlar
            preDeployedDiameter = 1.5
            deployedDiameter = 4.0
            minIsPressure = false
            minDeployment = 30000
            deploymentAlt = 10000
            cutAlt = 3000
            preDeploymentSpeed = 1
            deploymentSpeed = 3
            preDeploymentAnimation = RC_chute2_semi_deploy
            deploymentAnimation = RC_chute2_full_deploy
            parachuteName = RC_canopy2
            capName = cover
        }
    }
}

