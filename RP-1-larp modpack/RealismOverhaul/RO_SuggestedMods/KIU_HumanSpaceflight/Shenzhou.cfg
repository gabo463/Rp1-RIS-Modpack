// --------------------------------------------------------
// Orbital Module
// --------------------------------------------------------
@PART[KCHS_SZ_OrbitalModule]:FOR[RealismOverhaul]
{
    %RSSROConfig = true
    @rescaleFactor = 1.0
    @title = Shenzhou Orbital Module
    @manufacturer = CAST
    
    @mass = 1.50
    @maxTemp = 900
    @skinMaxTemp = 2000
    
    @MODULE[ModuleCommand]
    {
        @minimumCrew = 0
        @RESOURCE[ElectricCharge]
        {
            @rate = 1.0
        }
    }
    
    !RESOURCE,* {}
    !MODULE[ModuleReactionWheel],* {}
    !MODULE[ModuleFuelTanks],* {}
    !MODULE[ModuleB9PartSwitch],* {}
    
    MODULE
    {
        name = ModuleFuelTanks
        type = ServiceModule
        volume = 2000
        basemass = -1
        
        TANK
        {
            name = Food
            amount = 120
            maxAmount = 120
        }
        TANK
        {
            name = Water
            amount = 80
            maxAmount = 80
        }
        TANK
        {
            name = Oxygen
            amount = 12000
            maxAmount = 12000
        }
        TANK
        {
            name = Nitrogen
            amount = 8000
            maxAmount = 8000
        }
        TANK
        {
            name = Waste
            amount = 0
            maxAmount = 20
        }
        TANK
        {
            name = WasteWater
            amount = 0
            maxAmount = 50
        }
        TANK
        {
            name = CarbonDioxide
            amount = 0
            maxAmount = 10000
        }
        TANK
        {
            name = Hydrazine
            amount = 50
            maxAmount = 50
        }
        TANK
        {
            name = Helium
            amount = 500
            maxAmount = 500
        }
        TANK
        {
            name = ElectricCharge
            amount = 15000
            maxAmount = 15000
        }
    }
    
    !MODULE[ModuleRCS*],* {}
    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = RCSthruster
        thrusterPower = 0.15
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = RCSrunning
        
        PROPELLANT
        {
            name = Hydrazine
            ratio = 1.0
        }
        PROPELLANT
        {
            name = Helium
            ratio = 11.25
            ignoreForIsp = True
        }
        
        atmosphereCurve
        {
            key = 0 280
            key = 1 100
        }
    }
}

