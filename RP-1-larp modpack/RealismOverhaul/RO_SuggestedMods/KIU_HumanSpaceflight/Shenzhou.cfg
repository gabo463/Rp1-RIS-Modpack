// --------------------------------------------------------
// Service Module
// --------------------------------------------------------
@PART[KCHS_SZ_ServiceModule]:FOR[RealismOverhaul]
{
    %RSSROConfig = true
    @rescaleFactor = 1.0
    @title = Shenzhou Service Module
    @manufacturer = CAST
    
    @mass = 1.20
    @maxTemp = 900
    @skinMaxTemp = 2000
    
    !RESOURCE,* {}
    !MODULE[ModuleFuelTanks],* {}
    !MODULE[ModuleB9PartSwitch],* {}
    
    %MODULE[ModuleFuelTanks]
    {
        %type = ServiceModule
        %volume = 1100
        %basemass = -1
        
        TANK
        {
            name = UDMH
            amount = 368
            maxAmount = 368
        }
        TANK
        {
            name = NTO
            amount = 522
            maxAmount = 522
        }
        TANK
        {
            name = Helium
            amount = 18500
            maxAmount = 18500
        }
        TANK
        {
            name = ElectricCharge
            amount = 20000
            maxAmount = 20000
        }
    }
    
    !MODULE[ModuleEngines*],* {}
    MODULE
    {
        name = ModuleEnginesFX
        thrustVectorTransformName = thrustTransform
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 10.0
        maxThrust = 10.0
        heatProduction = 30
        fxOffset = 0, 0, 0.01
        EngineType = LiquidFuel
        exhaustDamageDistanceOffset = 0.12
    }
    
    !MODULE[ModuleEngineConfigs],* {}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEnginesFX
        configuration = Shenzhou Main Engine
        
        CONFIG
        {
            name = Shenzhou Main Engine
            minThrust = 10.0
            maxThrust = 10.0
            heatProduction = 30
            ullage = False
            pressureFed = False
            ignitions = 50
            
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.1
            }
            
            PROPELLANT
            {
                name = UDMH
                ratio = 0.413
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.587
                DrawGauge = False
            }
            PROPELLANT
            {
                name = Helium
                ratio = 11.25
                ignoreForIsp = True
            }
            
            atmosphereCurve
            {
                key = 0 290
                key = 1 120
            }
        }
    }
    
    !MODULE[ModuleRCS*],* {}
    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = RCSthruster
        thrusterPower = 0.15
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = RCSrunning
        
        PROPELLANT
        {
            name = UDMH
            ratio = 0.413
        }
        PROPELLANT
        {
            name = NTO
            ratio = 0.587
        }
        PROPELLANT
        {
            name = Helium
            ratio = 11.25
            ignoreForIsp = True
        }
        
        atmosphereCurve
        {
            key = 0 280
            key = 1 100
        }
    }
}

// --------------------------------------------------------
// RA
// --------------------------------------------------------
@PART[KCHS_SZ_OrbitalModule|KCHS_SZ_Re_entryModule]:AFTER[RealAntennas]
{
    !MODULE[ModuleDataTransmitter],* {}
    !MODULE[ModuleRealAntenna],* {}
    MODULE
    {
        name = ModuleRealAntenna
        referenceGain = 1.5
        RFBand = S
    }
}

@PART[KCHS_SZ_ServiceModule]:AFTER[RealAntennas]
{
    !MODULE[ModuleDataTransmitter],* {}
    !MODULE[ModuleRealAntenna],* {}
    MODULE
    {
        name = ModuleRealAntenna
        antennaDiameter = 0.8
        RFBand = S
    }
}