// --------------------------------------------------------
// Re-entry Module
// --------------------------------------------------------
@PART[KCHS_Mengzhou_ReEntry_Module]:FOR[RealismOverhaul]
{
    %RSSROConfig = true
    @rescaleFactor = 1.0
    @title = Mengzhou Re-entry Capsule
    @manufacturer = CAST
    
    @mass = 5.60
    %skinMaxTemp = 2500
    %skinInternalConductionMult = 0.005
    %skinTempTag = HRSI
    %internalTempTag = Instruments
    
    @MODULE[ModuleCommand]
    {
        @minimumCrew = 0
        @RESOURCE[ElectricCharge]
        {
            @rate = 1.5
        }
    }
    
    !RESOURCE,* {}
    !MODULE[ModuleReactionWheel],* {}
    !MODULE[ModuleFuelTanks],* {}
    !MODULE[ModuleDataTransmitter],* {}
    
    MODULE
    {
        name = ModuleRealAntenna
        referenceGain = 2.0
    }
    
    MODULE
    {
        name = ModuleFuelTanks
        type = ServiceModule
        volume = 2000
        basemass = -1
        
        TANK
        {
            name = Food
            amount = 300
            maxAmount = 300
        }
        TANK
        {
            name = Water
            amount = 200
            maxAmount = 200
        }
        TANK
        {
            name = Oxygen
            amount = 45000
            maxAmount = 45000
        }
        TANK
        {
            name = Nitrogen
            amount = 20000
            maxAmount = 20000
        }
        TANK
        {
            name = Waste
            amount = 0
            maxAmount = 50
        }
        TANK
        {
            name = WasteWater
            amount = 0
            maxAmount = 100
        }
        TANK
        {
            name = CarbonDioxide
            amount = 0
            maxAmount = 30000
        }
        TANK
        {
            name = LithiumHydroxide
            amount = 200
            maxAmount = 200
        }
        TANK
        {
            name = Hydrazine
            amount = 150
            maxAmount = 150
        }
        TANK
        {
            name = Helium
            amount = 1500
            maxAmount = 1500
        }
        TANK
        {
            name = ElectricCharge
            amount = 25000
            maxAmount = 25000
        }
    }
    
    !MODULE[ModuleRCS*],* {}
    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = RCS
        thrusterPower = 0.25
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = RCSrunning
        
        PROPELLANT
        {
            name = Hydrazine
            ratio = 1.0
        }
        PROPELLANT
        {
            name = Helium
            ratio = 11.25
            ignoreForIsp = True
        }
        
        atmosphereCurve
        {
            key = 0 280
            key = 1 100
        }
    }
}

// --------------------------------------------------------
// Drogue Parachutes
// --------------------------------------------------------
@PART[KCHS_Mengzhou_Drogue_Chute]:FOR[RealismOverhaul]
{
    %RSSROConfig = true
    @rescaleFactor = 1.0
    @title = Mengzhou Drogue Parachutes
    @manufacturer = CAST
    
    @mass = 0.15
    @maxTemp = 900
    @skinMaxTemp = 2000
    
    !MODULE[RealChuteModule],* {}
    
    MODULE
    {
        name = RealChuteModule
        caseMass = 0.15
        timer = 0
        mustGoDown = true
        spareChutes = 0
        cutSpeed = 0.5
        
        PARACHUTE
        {
            material = Kevlar
            preDeployedDiameter = 4.0
            deployedDiameter = 12.0
            minIsPressure = false
            minDeployment = 30000
            deploymentAlt = 10000
            cutAlt = 3000
            preDeploymentSpeed = 1
            deploymentSpeed = 3
            preDeploymentAnimation = RC_chute2_semi_deploy
            deploymentAnimation = RC_chute2_full_deploy
            parachuteName = RC_canopy2
            capName = DrogueChute
        }
    }
}

