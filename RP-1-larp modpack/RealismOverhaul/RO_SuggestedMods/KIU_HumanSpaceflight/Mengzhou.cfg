// --------------------------------------------------------
// Engine
// --------------------------------------------------------
@PART[KCHS_Mengzhou_Engine]:FOR[RealismOverhaul]
{
    %RSSROConfig = true
    @rescaleFactor = 1.0
    @title = Mengzhou Main Engine
    @manufacturer = CAST
    
    @mass = 0.08
    @maxTemp = 900
    @skinMaxTemp = 2000
    
    !MODULE[ModuleEngines*],* {}
    MODULE
    {
        name = ModuleEnginesFX
        thrustVectorTransformName = thrustTransform
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 10.0
        maxThrust = 10.0
        heatProduction = 30
        fxOffset = 0, 0, 0.01
        EngineType = LiquidFuel
    }
    
    !MODULE[ModuleEngineConfigs],* {}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEnginesFX
        configuration = Mengzhou Main Engine
        
        CONFIG
        {
            name = Mengzhou Main Engine
            minThrust = 10.0
            maxThrust = 10.0
            heatProduction = 30
            ullage = False
            pressureFed = False
            ignitions = 50
            
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.1
            }
            
            PROPELLANT
            {
                name = UDMH
                ratio = 0.413
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.587
                DrawGauge = False
            }
            PROPELLANT
            {
                name = Helium
                ratio = 11.25
                ignoreForIsp = True
            }
            
            atmosphereCurve
            {
                key = 0 310
                key = 1 120
            }
        }
    }
}

