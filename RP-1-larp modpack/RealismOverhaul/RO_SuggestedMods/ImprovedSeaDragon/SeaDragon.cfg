// Sources: Wikipedia "Sea Dragon (rocket)", Astronautix "Sea Dragon"
// Gross mass ~18,000-18,143 t, payload 550 t, 8 mm maraging steel hull

// ---------------------------------------------------------------
// STAGE 1 TANK  (RP-1 / LOX)
// ---------------------------------------------------------------
@PART[SDFirstTank]:FOR[ImprovedSeaDragon]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6


	@maxTemp = 1200
	%skinMaxTemp = 2500 // reantry
	%emissiveConstant = 0.6
	%thermalMassModifier = 1.0
	%skinMassPerArea = 4	

	@mass = 919.076		// ~2,026,215 lb dry, incl. pressurizing gases

	!RESOURCE,*{}

	!MODULE[ModuleFuelTanks]{}

	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		type = Fuselage
		volume = 11240788	

		// 7,991,194 kg LOX -> 7,003,676 L
		TANK
		{
			name = LqdOxygen
			amount = 7003676
			maxAmount = 7003676
		}
		// 3,474,432 kg RP-1 -> 4,237,112 L
		TANK
		{
			name = Kerosene
			amount = 4237112
			maxAmount = 4237112
		}
	}
}

// ---------------------------------------------------------------
// STAGE 2 TANK  (LH2 / LOX) 
// ---------------------------------------------------------------
@PART[SDSecondTank]:FOR[ImprovedSeaDragon]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6

	@maxTemp = 1200
	%skinMaxTemp = 1700
	%emissiveConstant = 0.6
	%thermalMassModifier = 1.0
	%skinMassPerArea = 4	

	@mass = 386.265		

	!RESOURCE,*{}
	!MODULE[ModuleFuelTanks]{}

	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		type = Fuselage
		volume = 13432214

		// 3,631,027 kg LOX -> 3,182,320 L
		TANK
		{
			name = LqdOxygen
			amount = 3182320
			maxAmount = 3182320
		}
		// 726,205 kg LH2 -> 10,249,894 L
		// (includes propellant for the 4 verniers, 1340 s burn)
		TANK
		{
			name = LqdHydrogen
			amount = 10249894
			maxAmount = 10249894
		}
	}
}

// ---------------------------------------------------------------
// FAIRING
// ---------------------------------------------------------------
@PART[SDPayloadFairing]:FOR[ImprovedSeaDragon]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6
}

// ---------------------------------------------------------------
// ENGINES: thermal/scale only
// ---------------------------------------------------------------
@PART[SDEngine1|SDEngine2]:FOR[RealismOverhaul]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6

	@maxTemp = 1000		
	%skinMaxTemp = 1000
	%emissiveConstant = 0.6
	%thermalMassModifier = 1.0
	%skinMassPerArea = 4
}